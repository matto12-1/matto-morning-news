<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아침 검토 · 오늘의 아침신문</title>
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body { font-family: Pretendard, system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 24px; color: #232019; background: #fbf7ef; }
    h1 { font-size: 1.5rem; }
    .item { background: #fff; border: 1px solid #e7ddc9; border-radius: 12px; padding: 16px; margin: 0 0 14px; }
    .item h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .meta { color: #8a7f6a; font-size: .85rem; margin: 0 0 8px; }
    .src { font-size: .85rem; color: #5b5346; background: #f4efe3; padding: 8px 10px; border-radius: 8px; }
    details { margin-top: 8px; }
    a { color: #d1462f; }
  </style>
</head>
<body>
  <h1>🔎 아침 검토</h1>
  <p>생성된 기사를 출처와 함께 훑어보고, 부적절한 게 있으면 해당 <code>content/*.json</code>을 손보거나 <code>index.json</code>에서 날짜를 빼세요.</p>
  <div id="list">불러오는 중…</div>
  <script type="module">
    const list = document.getElementById("list");
    try {
      const dates = await (await fetch("/content/index.json")).json();
      const recent = [...dates].sort().reverse().slice(0, 30);
      const articles = await Promise.all(recent.map(d => fetch(`/content/${d}.json`).then(r => r.json())));
      list.innerHTML = articles.map(a => `
        <div class="item">
          <div class="meta">${a.date} · 제${a.issueNo}호 · ${a.categoryLabel || a.category}</div>
          <h2>${a.title}</h2>
          <p>${a.subtitle || ""}</p>
          <div class="src">출처: ${a.source || "(없음)"}</div>
          <details><summary>본문 미리보기</summary>
            <p><b>저학년</b><br>${(a.body?.lower||"").replace(/\n/g,"<br>")}</p>
            <p><b>고학년</b><br>${(a.body?.upper||"").replace(/\n/g,"<br>")}</p>
          </details>
          <p><a href="/?date=${a.date}" target="_blank">→ 이 호 열어보기</a></p>
        </div>`).join("");
    } catch (e) {
      list.textContent = "불러오지 못했어요: " + e.message;
    }
  </script>
</body>
</html>
